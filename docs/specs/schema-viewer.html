<style>
:root {

  --fk:#4B3FA8; --fk-soft:#ECEAF9; --grid:#E6E9E7;

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#111816; --surface:#1A2320; --border:#2A3632; --text:#EEF2F0; --muted:#A8B3AE; --subtle:#7E8A85; --primary-soft:#1E3A32; --journey-soft:#3F2A1C; --fk-soft:#2A2748; --grid:#1B2521; } }
:root[data-theme="dark"] { --bg:#111816; --surface:#1A2320; --border:#2A3632; --text:#EEF2F0; --muted:#A8B3AE; --subtle:#7E8A85; --primary-soft:#1E3A32; --journey-soft:#3F2A1C; --fk-soft:#2A2748; --grid:#1B2521; }
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--text); font:13px/1.45 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif; display:flex; flex-direction:column; overflow:hidden; }
header { flex-shrink:0; background:var(--surface); border-bottom:1px solid var(--border); padding:8px 14px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; z-index:5; }
header h1 { font-size:15px; margin:0 8px 0 0; font-weight:800; white-space:nowrap; }
header h1 span { color:var(--primary); }
select, input[type=search], button { font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:9px; padding:0 10px; min-height:38px; }
input[type=search] { width:200px; }
button { cursor:pointer; white-space:nowrap; }
button.on { background:var(--primary); color:#fff; border-color:var(--primary); }
.zoom { display:flex; align-items:center; gap:4px; }
.zoom button { min-width:38px; padding:0; }
.zoom span { min-width:44px; text-align:center; font-size:12px; color:var(--muted); }
.count { margin-left:auto; color:var(--subtle); font-size:12px; white-space:nowrap; }
.hint { flex-basis:100%; font-size:11.5px; color:var(--subtle); }

#viewport { flex-grow:1; overflow:auto; position:relative; cursor:grab;
  background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:24px 24px; }
#viewport.panning { cursor:grabbing; }
#world { position:relative; transform-origin:0 0; }
#links { position:absolute; left:0; top:0; overflow:visible; pointer-events:none; z-index:1; }
#links path { fill:none; stroke:var(--fk); stroke-width:1.5; opacity:.35; }
#links path.hl { opacity:1; stroke-width:2.2; }
#links path.dim { opacity:.05; }
#links marker path { fill:none; stroke:var(--fk); stroke-width:1.5; opacity:1; }
#links marker.circle circle { fill:var(--surface); stroke:var(--fk); stroke-width:1.5; }

.zone { position:absolute; border:1.5px dashed var(--border); border-radius:18px; pointer-events:none; z-index:0; }
.zone b { position:absolute; left:14px; top:-11px; background:var(--bg); padding:0 8px; font-size:12px; color:var(--subtle); letter-spacing:.3px; }

.tbl { position:absolute; width:300px; background:var(--surface); border:1px solid var(--border); border-radius:14px; z-index:2; box-shadow:0 1px 2px rgba(0,0,0,.04); user-select:none; }
.tbl.hl { border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft), 0 6px 20px rgba(0,0,0,.12); z-index:4; }
.tbl.dim { opacity:.3; }
.tbl.dragging { z-index:5; box-shadow:0 12px 30px rgba(0,0,0,.2); cursor:grabbing; }
.tbl.hidden { display:none; }
.tbl.match { outline:2px solid var(--journey); outline-offset:2px; }
.th { background:var(--primary-strong); color:#fff; padding:9px 12px; border-radius:13px 13px 0 0; cursor:grab; border-top:4px solid var(--mod, var(--primary)); }
.th b { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:13px; }
.th small { display:block; font-weight:500; opacity:.85; font-size:11px; margin-top:2px; line-height:1.35; }
.th .mod { float:right; font-size:10px; font-weight:700; opacity:.7; letter-spacing:.5px; }
.socle { font-size:11px; color:var(--subtle); padding:5px 12px; border-bottom:1px solid var(--border); }
.socle code { color:var(--muted); }
.col { display:grid; grid-template-columns:auto 1fr auto; gap:4px 8px; padding:5px 12px; border-bottom:1px solid var(--border); font-size:12px; align-items:baseline; }
.col:last-of-type { border-bottom:0; }
.col .n { font-family:ui-monospace, Menlo, Consolas, monospace; font-weight:600; }
.col .n.pk::before { content:"⚿"; font-size:11px; margin-right:4px; color:var(--primary); }
.col .t { color:var(--muted); font-size:11px; }
.col .f { display:flex; gap:3px; }
.col .f span { font-size:9px; font-weight:700; letter-spacing:.4px; padding:1px 4px; border-radius:4px; background:var(--bg); color:var(--muted); }
.col .f span.uq { background:var(--journey-soft); color:#B4581F; }
.col .f span.pk { background:var(--primary-soft); color:var(--primary-strong); }
.col .ref { grid-column:1 / -1; font-size:11px; }
.col .ref a { color:var(--fk); text-decoration:none; font-family:ui-monospace, Menlo, Consolas, monospace; background:var(--fk-soft); padding:1px 6px; border-radius:5px; pointer-events:auto; }
.col .ref a:hover { text-decoration:underline; }
.col .note { grid-column:1 / -1; color:var(--subtle); font-size:11px; line-height:1.35; }
body.nonotes .col .note { display:none; }
.cons { padding:5px 12px; font-size:11px; color:var(--muted); border-top:1px solid var(--border); background:var(--bg); }
.rel { padding:6px 12px; font-size:11px; border-top:1px solid var(--border); color:var(--muted); border-radius:0 0 13px 13px; }
.rel a { color:var(--fk); text-decoration:none; }
.rel a:hover { text-decoration:underline; }
@media (max-width:640px) { header h1, .hint { display:none; } input[type=search] { width:140px; } }
</style>

const modColor = {};

DATA.modules.forEach((m, i) => {
  modColor[m.code] = `hsl(${(i * 47) % 360} 45% 55%)`;
  const o = document.createElement('option'); o.value = m.code; o.textContent = m.code + ' — ' + m.name; modSel.appendChild(o);

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- rendu des cartes ----------
function buildCards() {
  Object.values(cards).forEach(e => e.remove());
  world.querySelectorAll('.zone').forEach(e => e.remove());
  DATA.modules.forEach(m => m.tables.forEach(t => {
    const el = document.createElement('article');
    el.className = 'tbl'; el.dataset.name = t.name; el.style.setProperty('--mod', modColor[m.code]);
    el.dataset.search = (t.name + ' ' + t.cols.map(c => c.n).join(' ')).toLowerCase();
    const cols = t.cols.filter(c => showCommon || !COMMON_NAMES.has(c.n) || c.ref);
    const inc = incoming[t.name] || [];
    el.innerHTML = `
      <div class="th"><span class="mod">${esc(m.code)}</span><b>${esc(t.name)}</b><small>${esc(t.purpose)}</small></div>
      <div class="socle">socle <code>${esc(t.common)}</code>${t.common === 'none' ? '' : (showCommon ? '' : ' — colonnes communes masquées')}</div>
      ${cols.map(c => `
        <div class="col" data-col="${esc(c.n)}">
          <span class="n ${c.f.includes('pk') ? 'pk' : ''}">${esc(c.n)}</span>
          <span class="t">${esc(c.t)}</span>
          <span class="f">${c.f.split(' ').filter(Boolean).map(f => `<span class="${f}">${({pk:'PK',nn:'NN',uq:'UQ',idx:'IX'})[f]}</span>`).join('')}</span>
          ${c.ref ? `<span class="ref">→ <a href="#" data-go="${esc(c.ref.split('.')[0])}">${esc(c.ref)}</a></span>` : ''}
          ${c.note ? `<span class="note">${esc(c.note)}</span>` : ''}
        </div>`).join('')}
      ${t.uniques.length || t.checks.length ? `<div class="cons">${t.uniques.map(u => 'unique (' + u.map(esc).join(', ') + ')').join('<br>')}${t.checks.map(c => '<br>check ' + esc(c)).join('')}</div>` : ''}
      ${inc.length ? `<div class="rel">Référencée par : ${inc.map(r => `<a href="#" data-go="${esc(r.split('.')[0])}">${esc(r)}</a>`).join(' · ')}</div>` : ''}`;
    world.appendChild(el); cards[t.name] = el;
    el.querySelector('.th').addEventListener('pointerdown', startDrag);
    el.querySelector('.th').addEventListener('click', e => { if (!dragMoved) select(t.name); });
  }));
  world.querySelectorAll('[data-go]').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation(); goTo(a.dataset.go);
  }));
}

  const notes = showNotes ? t.cols.filter(c => c.note).length : 0;
  const refs = t.cols.filter(c => c.ref).length;
  return 78 + n * 27 + notes * 15 + refs * 17 + (t.uniques.length || t.checks.length ? 28 : 0) + ((incoming[t.name] || []).length ? 34 : 0);
}
function cardHeight(t) {
  const h = cards[t.name].offsetHeight;
  return h > 0 ? h : estimateHeight(t);
}
function autoLayout() {
  layoutMeasured = Object.values(cards).every(el => el.offsetHeight > 0);
  let y = 0;
  const byCode = Object.fromEntries(DATA.modules.map(m => [m.code, m]));
  ROWS.forEach(codes => {
    let x = 0, rowH = 0;
    codes.forEach(code => {
      const m = byCode[code]; if (!m) return;
      const n = m.tables.length;
      const ncol = Math.min(4, Math.max(1, Math.ceil(n / 3)));
      const colH = new Array(ncol).fill(0);
      const zoneW = ncol * CARD_W + (ncol - 1) * GAP + ZONE_PAD * 2;
      m.tables.forEach(t => {
        const h = cardHeight(t);
        let k = 0; for (let i = 1; i < ncol; i++) if (colH[i] < colH[k]) k = i;
        pos[t.name] = { x: x + ZONE_PAD + k * (CARD_W + GAP), y: y + ZONE_PAD + 16 + colH[k] };
        colH[k] += h + GAP;
      });
      const zoneH = Math.max(...colH) - GAP + ZONE_PAD * 2 + 16;
      m._zone = { x, y, w: zoneW, h: zoneH };
      x += zoneW + ZONE_GAP; rowH = Math.max(rowH, zoneH);
    });
    y += rowH + ZONE_GAP;
  });
}
function drawZones() {
  world.querySelectorAll('.zone').forEach(e => e.remove());
  DATA.modules.forEach(m => {
    if (!m._zone) return;
    const z = document.createElement('div'); z.className = 'zone';
    Object.assign(z.style, { left: m._zone.x + 'px', top: m._zone.y + 'px', width: m._zone.w + 'px', height: m._zone.h + 'px', borderColor: modColor[m.code] });
    z.innerHTML = `<b style="color:${modColor[m.code]}">${esc(m.code)} · ${esc(m.name)}</b>`;
    world.appendChild(z);
  });
}
function applyPositions() {
  let maxX = 0, maxY = 0;
  Object.entries(pos).forEach(([n, p]) => {
    const el = cards[n]; if (!el) return;
    el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
    maxX = Math.max(maxX, p.x + CARD_W); maxY = Math.max(maxY, p.y + el.offsetHeight);
  });
  world.style.width = (maxX + 200) + 'px'; world.style.height = (maxY + 200) + 'px';
  svg.setAttribute('width', maxX + 200); svg.setAttribute('height', maxY + 200);
}
function loadPositions() {
  try { const s = localStorage.getItem(STORE); if (!s) return false; const o = JSON.parse(s);
    if (!o || !o.pos || o.count !== Object.keys(cards).length) return false;
    Object.assign(pos, o.pos); DATA.modules.forEach((m, i) => m._zone = o.zones?.[i] || null); layoutMeasured = true; return true; } catch { return false; }
}
function savePositions() {
  if (!layoutMeasured) return;
  try { localStorage.setItem(STORE, JSON.stringify({ count: Object.keys(cards).length, pos, zones: DATA.modules.map(m => m._zone || null) })); } catch {}
}

// ---------- relations ----------
function drawLines() {
  svg.querySelectorAll('path.link').forEach(p => p.remove());
  if (!showLines) return;
  const frag = document.createDocumentFragment();
  Object.values(tableOf).forEach(t => {
    const src = cards[t.name]; if (src.classList.contains('hidden')) return;
    t.cols.forEach(c => {
      if (!c.ref) return;
      const target = c.ref.split('.')[0]; const dst = cards[target];
      if (!dst || dst.classList.contains('hidden')) return;
      const row = src.querySelector(`.col[data-col="${CSS.escape(c.n)}"]`); if (!row) return;
      const sp = pos[t.name], dp = pos[target];
      const ry = sp.y + row.offsetTop + row.offsetHeight / 2;
      const ty = dp.y + 20;
      const unique = c.f.includes('uq') || t.uniques.some(u => u.length === 1 && u[0] === c.n);
      const nn = c.f.includes('nn');
      let d;
      if (t.name === target) {
        const x1 = sp.x + CARD_W, x2 = dp.x + CARD_W;
        d = `M${x1},${ry} C${x1 + 70},${ry} ${x2 + 70},${ty} ${x2},${ty}`;
      } else {
        const rightward = (dp.x + CARD_W / 2) > (sp.x + CARD_W / 2);
        const x1 = rightward ? sp.x + CARD_W : sp.x;
        const x2 = rightward ? dp.x : dp.x + CARD_W;
        const dx = Math.max(50, Math.abs(x2 - x1) * 0.45) * (rightward ? 1 : -1);
        d = `M${x1},${ry} C${x1 + dx},${ry} ${x2 - dx},${ty} ${x2},${ty}`;
      }
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('d', d); p.classList.add('link');
      p.setAttribute('marker-start', unique ? 'url(#mk-one)' : 'url(#mk-many)');
      p.setAttribute('marker-end', nn ? 'url(#mk-bar)' : 'url(#mk-circle)');
      p.dataset.from = t.name; p.dataset.to = target;
      if (selected) p.classList.add(t.name === selected || target === selected ? 'hl' : 'dim');
      frag.appendChild(p);
    });
  });
  svg.appendChild(frag);
}

// ---------- sélection, filtre, recherche ----------
function relatedOf(name) {
  const s = new Set([name]);
  tableOf[name].cols.forEach(c => c.ref && s.add(c.ref.split('.')[0]));
  (incoming[name] || []).forEach(r => s.add(r.split('.')[0]));
  return s;
}
function select(name) {
  selected = selected === name ? null : name;
  const rel = selected ? relatedOf(selected) : null;
  Object.entries(cards).forEach(([n, el]) => { el.classList.toggle('hl', n === selected); el.classList.toggle('dim', !!selected && !rel.has(n)); });
  drawLines();
}
function applyFilter() {
  const mod = modSel.value, term = q.value.trim().toLowerCase();
  let visible = 0, first = null;
  const keep = new Set();
  if (mod !== 'all') {
    DATA.modules.find(m => m.code === mod).tables.forEach(t => { keep.add(t.name); if (linked) t.cols.forEach(c => c.ref && keep.add(c.ref.split('.')[0])); });
  }
  Object.entries(cards).forEach(([n, el]) => {
    const ok = mod === 'all' || keep.has(n);
    el.classList.toggle('hidden', !ok);
    const match = ok && term && el.dataset.search.includes(term);
    el.classList.toggle('match', !!match);
    if (ok) visible++; if (match && !first) first = n;
  });
  document.getElementById('count').textContent = visible + ' table' + (visible > 1 ? 's' : '') + ' · ' + svgCount() + ' relations';
  drawLines();
  if (first) goTo(first, false);
}
function svgCount() { let n = 0; Object.values(tableOf).forEach(t => t.cols.forEach(c => c.ref && !cards[t.name].classList.contains('hidden') && !cards[c.ref.split('.')[0]].classList.contains('hidden') && n++)); return n; }
function goTo(name, sel = true) {
  const el = cards[name]; if (!el) return;
  if (el.classList.contains('hidden')) { modSel.value = 'all'; applyFilter(); }
  const p = pos[name];
  viewport.scrollTo({ left: p.x * scale - viewport.clientWidth / 2 + CARD_W * scale / 2, top: p.y * scale - 80, behavior: 'smooth' });
  if (sel && selected !== name) select(name);
}

// ---------- déplacement des tables ----------
let drag = null, dragMoved = false;
function startDrag(e) {
  if (e.button !== 0) return;
  const el = e.currentTarget.closest('.tbl'); const name = el.dataset.name;
  drag = { name, el, sx: e.clientX, sy: e.clientY, ox: pos[name].x, oy: pos[name].y };
  dragMoved = false; el.classList.add('dragging'); el.setPointerCapture(e.pointerId);
  e.preventDefault(); e.stopPropagation();
  el.addEventListener('pointermove', onDrag); el.addEventListener('pointerup', endDrag); el.addEventListener('pointercancel', endDrag);
}
function onDrag(e) {
  if (!drag) return;
  const dx = (e.clientX - drag.sx) / scale, dy = (e.clientY - drag.sy) / scale;
  if (Math.abs(dx) + Math.abs(dy) > 2) dragMoved = true;
  pos[drag.name] = { x: Math.max(0, Math.round(drag.ox + dx)), y: Math.max(0, Math.round(drag.oy + dy)) };
  drag.el.style.left = pos[drag.name].x + 'px'; drag.el.style.top = pos[drag.name].y + 'px';
  drawLines();
}
function endDrag(e) {
  if (!drag) return;
  drag.el.classList.remove('dragging');
  drag.el.removeEventListener('pointermove', onDrag); drag.el.removeEventListener('pointerup', endDrag); drag.el.removeEventListener('pointercancel', endDrag);
  drag = null; applyPositions(); drawLines(); savePositions();
}

// ---------- panoramique du fond ----------
let pan = null;
viewport.addEventListener('pointerdown', e => {
  if (e.target.closest('.tbl') || e.button !== 0) return;
  pan = { x: e.clientX, y: e.clientY, sl: viewport.scrollLeft, st: viewport.scrollTop }; viewport.classList.add('panning');
});
viewport.addEventListener('pointermove', e => { if (!pan) return; viewport.scrollLeft = pan.sl - (e.clientX - pan.x); viewport.scrollTop = pan.st - (e.clientY - pan.y); });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => viewport.addEventListener(ev, () => { pan = null; viewport.classList.remove('panning'); }));
viewport.addEventListener('click', e => { if (!e.target.closest('.tbl') && selected && !pan) select(selected); });

// ---------- zoom ----------
function setScale(s) {
  scale = Math.min(1.5, Math.max(0.25, s));
  world.style.transform = `scale(${scale})`;
  document.getElementById('zVal').textContent = Math.round(scale * 100) + ' %';
}
document.getElementById('zIn').addEventListener('click', () => setScale(scale + 0.1));
document.getElementById('zOut').addEventListener('click', () => setScale(scale - 0.1));
document.getElementById('zFit').addEventListener('click', () => {
  const w = parseFloat(world.style.width), h = parseFloat(world.style.height);
  setScale(Math.min(viewport.clientWidth / w, viewport.clientHeight / h, 1)); viewport.scrollTo(0, 0);
});
viewport.addEventListener('wheel', e => { if (!e.ctrlKey && !e.metaKey) return; e.preventDefault(); setScale(scale * (e.deltaY < 0 ? 1.1 : 0.9)); }, { passive: false });

// ---------- contrôles ----------
modSel.addEventListener('change', applyFilter);
q.addEventListener('input', applyFilter);
document.getElementById('linked').addEventListener('click', e => { linked = !linked; e.target.classList.toggle('on', linked); applyFilter(); });
document.getElementById('tLines').addEventListener('click', e => { showLines = !showLines; e.target.classList.toggle('on', showLines); drawLines(); });
document.getElementById('tNotes').addEventListener('click', e => { showNotes = !showNotes; e.target.classList.toggle('on', showNotes); document.body.classList.toggle('nonotes', !showNotes); applyPositions(); drawLines(); });
document.getElementById('tCommon').addEventListener('click', e => { showCommon = !showCommon; e.target.classList.toggle('on', showCommon); rebuild(false); });
document.getElementById('reset').addEventListener('click', () => { try { localStorage.removeItem(STORE); } catch {} rebuild(true); });

function rebuild(forceAuto) {
  buildCards();
  if (forceAuto || !loadPositions()) { autoLayout(); savePositions(); }
  drawZones(); applyPositions(); applyFilter();
}
rebuild(false);
setScale(0.6);

// Si la page a été construite invisible (hauteurs à zéro), on recalcule dès qu'elle est affichée.
let retries = 0;
function ensureMeasured() {
  if (layoutMeasured) return;
  const visible = viewport.clientWidth > 0 && Object.values(cards).some(el => el.offsetHeight > 0);
  if (visible) { rebuild(true); setScale(0.6); return; }
  if (retries++ < 120) requestAnimationFrame(ensureMeasured);
}
requestAnimationFrame(ensureMeasured);
if (window.ResizeObserver) new ResizeObserver(() => { if (!layoutMeasured) ensureMeasured(); }).observe(viewport);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !layoutMeasured) ensureMeasured(); });
</script>
</body>
</html>
