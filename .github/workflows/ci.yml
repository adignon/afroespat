# Intégration continue — 00-fondations.md §11.4.
# Ordre imposé : installation → lint → types → unitaires → intégration →
# migrations à jour → build → bout en bout.
#
# La CI échoue sur un AVERTISSEMENT, pas seulement sur une erreur (§4).
name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: postgresql://app:app@localhost:5432/app?schema=public
  REDIS_URL: redis://localhost:6379
  NODE_ENV: test

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      # Le worker et la boîte d'envoi ont besoin de Redis : sans lui, les tests
      # d'intégration vérifieraient une chaîne débranchée.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - name: Installation
        run: pnpm install --frozen-lockfile

      - name: Secrets de test
        # Les fournisseurs externes sont tous simulés en CI (§11.3) :
        # aucun appel sortant, aucun coût, aucune dépendance réseau.
        run: cp .env.example .env

      - name: Client de base de données
        run: pnpm db:generate

      - name: Migrations
        run: pnpm --filter @app/db migrate:deploy

      # Les tests d'intégration de l'API interrogent des référentiels réels :
      # sans eux, ils vérifieraient une base vide, donc rien.
      - name: Données de départ
        run: pnpm db:seed

      # Une migration manquante est un échec, pas un avertissement : le schéma
      # et l'historique doivent concorder exactement (§11.4).
      - name: Migrations à jour
        run: pnpm --filter @app/db migrate:status

      # Le schéma Prisma et la base migrée doivent être identiques : `--exit-code`
      # rend 2 s'il reste une différence (un index renommé à la main, une colonne
      # ajoutée au schéma sans migration…). `migrate status` ne le voit pas : il ne
      # compare que l'historique, pas la structure. Lot A : un index mal nommé a
      # traîné ainsi trois migrations avant qu'on l'écrive.
      - name: Aucune dérive entre le schéma et la base
        run: pnpm --filter @app/db migrate:drift

      - name: Enums réexportés à jour
        # Le fichier généré est commité : s'il diffère, c'est que le schéma a
        # bougé sans régénérer. Voir packages/shared/scripts/generate-enums.mjs.
        run: pnpm --filter @app/shared generate:check

      - name: Lint
        run: pnpm lint

      - name: Vérification des types
        run: pnpm typecheck

      - name: Tests unitaires
        run: pnpm test

      - name: Tests d'intégration
        run: pnpm test:int

      - name: Build
        run: pnpm build

      # Garde-fous des règles dures (§0.7 du plan) : capacités déclarées,
      # terre cuite réservée, mots interdits, absence de rouge, contraste AA.
      - name: Garde-fous
        run: pnpm guardrails

      - name: Navigateurs Playwright
        run: pnpm --filter @app/web exec playwright install --with-deps chromium

      # Géométrie, jetons, responsivité de 320 à 1920 px, accessibilité axe-core.
      # Déterministe : aucune comparaison d'image ici (voir playwright.config.ts).
      - name: Tests de bout en bout
        run: pnpm --filter @app/web test:e2e
