# Stack locale — 00-fondations.md §11.1.
# Tous les fournisseurs externes sont simulés en local (§11.3) : aucun appel sortant.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Les extensions ne sont PAS créées ici : Prisma les déclare dans le schéma
      # et les crée par migration, pour qu'il n'y ait qu'une source de vérité.
      # Voir packages/db/docker/init-extensions.sql si l'utilisateur applicatif de
      # production n'a pas le droit de créer une extension.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Stockage objet compatible S3. En production : fournisseur UE (§8.2).
  storage:
    # Image servie depuis quay.io : minio/minio n'est plus public sur Docker Hub.
    image: quay.io/minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20

  # Boîte mail locale : rien ne sort. Interface web sur 8025.
  mail:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']

  # Analyse antivirus des fichiers importés avant publication (§8.3).
  antivirus:
    image: clamav/clamav:stable
    ports: ['3310:3310']
    healthcheck:
      test: ['CMD-SHELL', 'clamdcheck.sh || exit 1']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  pgdata:
  redisdata:
  miniodata:
